# Exemplo Nginx — /etc/nginx/sites-available/denteartlab
# Copie, ajuste ssl_certificate* e ative: ln -s ... sites-enabled && nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name denteartlab.com.br www.denteartlab.com.br;
    return 301 https://www.denteartlab.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name denteartlab.com.br;
    return 301 https://www.denteartlab.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.denteartlab.com.br;

    # ssl_certificate     /etc/letsencrypt/live/www.denteartlab.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.denteartlab.com.br/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket + long-polling do Socket.IO (módulo TV)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
