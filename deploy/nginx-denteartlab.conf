# Exemplo Nginx — /etc/nginx/sites-available/denteartlab
# Copie, ajuste ssl_certificate* e ative: ln -s ... sites-enabled && nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lab_protese_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream lab_protese_beta {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    server_name denteartlab.com.br www.denteartlab.com.br;
    return 301 https://www.denteartlab.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name denteartlab.com.br;
    return 301 https://www.denteartlab.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name beta.denteartlab.com.br;

    # ssl_certificate     /etc/letsencrypt/live/beta.denteartlab.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/beta.denteartlab.com.br/privkey.pem;

    client_max_body_size 50M;

    location /api/tv/socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://lab_protese_beta;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    server_name www.denteartlab.com.br;

    # ssl_certificate     /etc/letsencrypt/live/www.denteartlab.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.denteartlab.com.br/privkey.pem;

    client_max_body_size 50M;

    proxy_intercept_errors on;
    error_page 502 503 = @app_iniciando;

    location @app_iniciando {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="refresh" content="2"><title>Carregando...</title><style>body{font-family:sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f4f6f9;color:#334155}p{font-size:14px}</style></head><body><p>Sistema iniciando, aguarde...</p></body></html>';
    }

    location /api/tv/socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://lab_protese_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
