# Lab Prótese — nginx (apex + www no MESMO bloco, SEM redirect entre eles).
# Redirect apex↔www quebra o login: o POST /api/auth/login vira 301, o cookie
# fica no host errado e o browser volta ao /login sem mensagem de erro.
#
# Instalar:
#   sudo cp deploy/nginx-denteartlab.conf /etc/nginx/sites-available/denteartlab
#   sudo ln -sf /etc/nginx/sites-available/denteartlab /etc/nginx/sites-enabled/denteartlab
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ajuste os caminhos dos certificados se forem outros (certbot).

upstream lab_protese_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name denteartlab.com.br www.denteartlab.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name denteartlab.com.br www.denteartlab.com.br;

    # Certbot (troque se os arquivos forem outros)
    ssl_certificate     /etc/letsencrypt/live/denteartlab.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denteartlab.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://lab_protese_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
