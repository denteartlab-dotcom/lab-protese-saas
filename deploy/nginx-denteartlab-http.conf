# Nginx — denteartlab.com.br (HTTP apenas, ANTES do Certbot)
# Use esta config na primeira vez. Depois rode:
#   bash deploy/corrigir-ssl-denteartlab.sh
# ou:
#   bash deploy/configurar-nginx-denteartlab.sh --ssl
#
# NÃO use nginx-denteartlab.conf antes de emitir o certificado Let's Encrypt.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lab_protese_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 80;
    server_name denteartlab.com.br www.denteartlab.com.br;

    client_max_body_size 50M;

    proxy_intercept_errors on;
    error_page 502 503 = @app_iniciando;

    location @app_iniciando {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="refresh" content="2"><title>Carregando...</title><style>body{font-family:sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f4f6f9;color:#334155}p{font-size:14px}</style></head><body><p>Sistema iniciando, aguarde...</p></body></html>';
    }

    location /api/tv/socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://lab_protese_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
